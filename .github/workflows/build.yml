name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web files
        working-directory: rooznegar-github/rooznegar
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/

      - name: Install dependencies
        working-directory: rooznegar-github/rooznegar
        run: npm install

      - name: Add Android platform
        working-directory: rooznegar-github/rooznegar
        run: npx cap add android

      - name: Sync Android
        working-directory: rooznegar-github/rooznegar
        run: npx cap sync android

      - name: Build APK
        working-directory: rooznegar-github/rooznegar/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rooznegar-apk
          path: rooznegar-github/rooznegar/android/app/build/outputs/apk/debug/app-debug.apk
