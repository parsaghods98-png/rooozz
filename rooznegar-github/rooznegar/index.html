<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>برنامه روزانه من</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ff;--card:#fff;--tx:#241f45;--mu:#7a7798;--pr:#6d5dfc;--pr2:#efecff;--ok:#10b981;--wa:#f97316;--pk:#ec4899;--bd:#e6e2fb;--sh:0 6px 20px rgba(109,93,252,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12101f;--card:#1d1a33;--tx:#efedff;--mu:#a29fc4;--pr:#9a8cff;--pr2:#2a2550;--bd:#322d58;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12101f;--card:#1d1a33;--tx:#efedff;--mu:#a29fc4;--pr:#9a8cff;--pr2:#2a2550;--bd:#322d58;--sh:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.7;padding-bottom:96px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:21px;margin:4px 0 10px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:13px}
.hero{background:linear-gradient(135deg,#6d5dfc,#a855f7 55%,#ec4899);color:#fff;border-radius:24px;padding:20px 18px;margin-bottom:14px;position:relative;box-shadow:0 10px 26px rgba(168,85,247,.35)}
.hero h1{margin:0;font-size:22px}.hero p{margin:2px 0 0;opacity:.9;font-size:13px}
.av{position:absolute;left:14px;top:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);font-size:22px;padding:0;color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb{background:var(--card);border-radius:18px;padding:10px 4px;text-align:center;box-shadow:var(--sh);border:1px solid var(--bd)}
.rb div{font-size:12px;color:var(--mu);line-height:1.4}.rb b{font-size:13px;display:block;color:var(--tx)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:14px;padding:10px 12px;margin:4px 0 10px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr)}
label{font-size:13px;color:var(--mu)}
button{font:inherit;border:0;border-radius:14px;padding:11px 14px;background:linear-gradient(135deg,var(--pr),#a855f7);color:#fff;font-weight:600;width:100%}
button.sec{background:var(--pr2);color:var(--pr)}button.dn{background:linear-gradient(135deg,#f97316,#ec4899)}button:disabled{opacity:.55}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row>div{flex:1}
.row input[type=checkbox]{width:24px;height:24px;margin:0;accent-color:var(--ok)}
.x{width:auto;background:none;color:var(--wa);padding:4px 8px}
.bar{height:11px;background:var(--pr2);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#14b8a6);border-radius:9px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(109,93,252,.1)}
nav button{background:none;color:var(--mu);padding:3px 0;font-size:11px;font-weight:400;flex:1;border-radius:12px}
nav button.on{color:var(--pr);font-weight:800;background:var(--pr2)}nav span{display:block;font-size:20px;line-height:1.3}
.msg{padding:10px 13px;border-radius:16px;margin:7px 0;white-space:pre-wrap;max-width:88%}
.me{background:linear-gradient(135deg,var(--pr),#a855f7);color:#fff;margin-inline-end:auto;border-end-start-radius:4px}
.bot{background:var(--pr2);border-end-end-radius:4px}
.alert{background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;border-radius:18px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.tm{font-size:48px;font-weight:800;text-align:center;letter-spacing:1px;margin:6px 0 12px}
.chip{display:inline-block;width:auto;background:var(--pr2);color:var(--pr);padding:5px 12px;margin:0 0 6px 6px;border-radius:20px;font-size:13px}
.tr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.tp{display:flex;align-items:center;gap:4px;width:150px;direction:ltr}.tp select{margin:0}
.tl{display:flex;gap:12px;align-items:center;padding:8px 0}
.tl b{background:var(--pr2);color:var(--pr);border-radius:12px;padding:3px 10px;min-width:72px;text-align:center}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:56px;opacity:.18;pointer-events:none}
.chip.on{background:var(--pr);color:#fff}
.tile{background:linear-gradient(160deg,var(--pr2),var(--card));border:2px solid var(--bd);border-radius:16px;padding:8px 2px;text-align:center;font-size:11px;color:var(--tx);font-weight:600;width:auto}
.tile span{display:block;font-size:30px;line-height:1.3}.tile.on{border-color:var(--pr);background:var(--pr2)}
.gls{display:flex;gap:6px;justify-content:space-between}.gl{width:auto;flex:1;padding:8px 0;background:var(--pr2);font-size:20px;opacity:.35}.gl.on{opacity:1;background:#dbeafe}
:root{--bg:#f6f7fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--pr:#4f46e5;--pr2:#eef2ff;--bd:#e8ebf3;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);--navbg:rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f19;--card:#141a29;--tx:#f1f5f9;--mu:#94a3b8;--pr:#818cf8;--pr2:#1e2542;--bd:#242c40;--sh:none;--navbg:rgba(20,26,41,.88)}}
:root[data-theme="dark"]{--bg:#0b0f19;--card:#141a29;--tx:#f1f5f9;--mu:#94a3b8;--pr:#818cf8;--pr2:#1e2542;--bd:#242c40;--sh:none;--navbg:rgba(20,26,41,.88)}
body{padding-bottom:112px}h1{font-size:24px;font-weight:800}
.card{border-radius:22px;padding:18px}.rb{border-radius:20px}
.hero{background:linear-gradient(135deg,#4338ca,#6d28d9 55%,#be185d);border-radius:28px;padding:24px 20px;box-shadow:0 18px 40px -12px rgba(79,70,229,.5)}
button{background:var(--pr);border-radius:14px;padding:12px 16px;transition:transform .12s}button:active{transform:scale(.97)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:26px;border:1px solid var(--bd);background:var(--navbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(15,23,42,.14)}
nav button{background:none;border-radius:20px;padding:6px 0 4px}nav button.on{background:var(--pr2);color:var(--pr)}
nav span{display:flex;justify-content:center}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tm{font-variant-numeric:tabular-nums}
.hdr{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}.hdr h1{order:1;font-size:20px;margin:0}.hdr p{display:none}
.hdr .av{position:static;order:2;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#db2777);font-size:18px;color:#fff;padding:0;box-shadow:0 6px 16px -4px rgba(79,70,229,.5)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PD='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>PD[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>PD.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫،,]/g,'.');
const num=s=>parseFloat(en(s))||0;
const f=n=>fa(Math.round(Number(n)||0));
const f1=n=>fa((Math.round(n*10)/10).toString()).replace('.','٫');
const pad=n=>String(n).padStart(2,'0');
const tf=(h,m)=>fa(pad(h))+':'+fa(pad(m));
const hms=s=>{s=Math.floor(s);return fa(pad(Math.floor(s/3600)))+':'+fa(pad(Math.floor(s%3600/60)))+':'+fa(pad(s%60))};
const dur=s=>{const m=Math.round(s/60);if(s<60)return f(s)+' ثانیه';const h=Math.floor(m/60);return (h?f(h)+' ساعت'+(m%60?' و ':''):'')+(m%60?f(m%60)+' دقیقه':'')};
let mem=null;
function load(){try{return JSON.parse(localStorage.getItem('dp2'))}catch(x){return mem}}
let S=load()||{p:null,d:{},timer:null};S.habits=S.habits||[{id:1,t:'مسواک زدن'},{id:2,t:'خوردن صبحانه'},{id:3,t:'مرور درس‌ها'},{id:4,t:'مرتب کردن میز'},{id:5,t:'خوابیدن سر وقت'}];
function save(){try{localStorage.setItem('dp2',JSON.stringify(S))}catch(x){mem=S}}
function key(){const t=new Date();return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate()}
function day(){const d=S.d[key()]||(S.d[key()]={foods:[],plan:null,done:{},extra:[],study:[]});d.hab=d.hab||{};d.water=d.water||0;return d}
let tab=S.p?'home':'profile',chat=[],busy='',err='',rang=false,ringNow=false,SUBS=[];

function calc(){
 const p=S.p,d=day();
 const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*1.4;
 let target=p.goal<p.w-0.5?tdee-400:p.goal>p.w+0.5?tdee+300:tdee;
 target=Math.max(target,1500);
 const eaten=d.foods.reduce((a,x)=>a+x.kcal,0);
 const burned=(d.plan?d.plan.exercises.reduce((a,x,i)=>a+(d.done[i]?x.kcal:0),0):0)+d.extra.reduce((a,x)=>a+x.kcal,0);
 const study=d.study.reduce((a,x)=>a+x.sec,0);
 const ex=d.plan?d.plan.exercises.length:0,exd=d.plan?Object.values(d.done).filter(Boolean).length:0;
 return{target,eaten,burned,study,net:eaten-burned,ex,exd};
}
function bedMin(){const p=S.p;return((p.wakeH*60+p.wakeM-p.sleepH*60)%1440+1440)%1440}
async function ai(prompt,json){
 if(!window.claude)throw{code:'na'};
 const s=await claude.use('sample');if(!s)throw{code:'na'};
 return json?await s.json(prompt):(await s(prompt,{cache:false})).text;
}
function aiErr(x){return x&&x.code==='na'?'دستیار هوشمند فقط داخل برنامه‌ی کلود کار می‌کند و اینجا در دسترس نیست.':'مشکلی پیش آمد، دوباره امتحان کن.'}
function prof(){const p=S.p;return `دانش‌آموز، ${p.sex==='m'?'پسر':'دختر'}، ${p.age} ساله، قد ${p.h} سانتی‌متر، وزن ${p.w} کیلو، وزن هدف ${p.goal} کیلو`}

function ring(p,col,t1,t2){
 p=Math.max(0,Math.min(1,p||0));const C=213.6;
 return `<div class="rb"><svg viewBox="0 0 80 80" width="76" height="76"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--pr2)" stroke-width="8"/><circle cx="40" cy="40" r="34" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" font-size="15" font-weight="800" fill="var(--tx)" font-family="inherit">${f(p*100)}٪</text></svg><b>${t1}</b><div>${t2}</div></div>`;
}
function home(){
 const c=calc(),p=S.p,left=p.w-p.goal;
 return `${ringNow?'<div class="alert">⏰ وقت بیدار شدنه! صبح بخیر. برو سراغ ورزش امروز. <button class="sec" style="margin-top:8px" onclick="ringNow=false;render()">باشه</button></div>':''}
 <div class="hdr"><button class="av" onclick="tab='profile';render()">👤</button><h1>سلام ${e(p.name||'')} 👋</h1><p>${new Date().toLocaleDateString('fa-IR',{weekday:'long',day:'numeric',month:'long'})}</p></div>
 ${S.timer?'<div class="alert" style="background:linear-gradient(135deg,#10b981,#14b8a6)" onclick="tab=\'study\';render()">⏱ تایمر مطالعه‌ی «'+e(S.timer.name)+'» '+(S.timer.run?'در حال اجراست':'متوقف است')+'</div>':''}
 <div class="g3" style="margin-bottom:12px">
 ${ring(c.eaten/c.target,'#f97316','🍽️ تغذیه',f(c.eaten)+' از '+f(c.target))}
 ${ring(c.study/(p.studyH*3600),'#6d5dfc','📚 مطالعه',f1(c.study/3600)+' از '+f1(p.studyH)+' ساعت')}
 ${ring(c.ex?c.exd/c.ex:0,'#10b981','🏋️ ورزش',c.ex?f(c.exd)+' از '+f(c.ex)+' حرکت':'بدون برنامه')}</div>
 ${calCard()}<div class="g2"><div class="card"><div class="mu">🔥 سوزانده‌شده</div><b style="font-size:22px">${f(c.burned)}</b> <span class="mu">کالری</span></div>
 <div class="card"><div class="mu">⚖️ تا وزن هدف</div><b style="font-size:22px">${f1(Math.abs(left))}</b> <span class="mu">کیلو ${left>0?'کاهش':left<0?'افزایش':''}</span></div></div>
 <div class="card"><h2>🗓️ برنامه‌ی امروز <span class="mu" style="font-weight:400">— ${new Date().toLocaleDateString('fa-IR',{weekday:'long',day:'numeric',month:'long'})}</span></h2>${timeline()}</div>${habitsCard()}<button class="sec" onclick="tab='coach';render()">🤖 از دستیار بپرس</button>`;
}
function timeline(){
 if(S.blocks&&S.blocks.length)return S.blocks.map(x=>`<div class="tl"><b>${tf(x.h,x.m)}</b><span>${e(x.title)}</span></div>`).join('');
 const p=S.p,w=p.wakeH*60+p.wakeM,b=bedMin();
 const it=[[w,'⏰','بیدار شدن'],[p.gymH*60+p.gymM,'🏋️','رفتن به باشگاه'],[b,'🌙','رفتن به رخت‌خواب']].sort((a,b2)=>((a[0]-w+1440)%1440)-((b2[0]-w+1440)%1440));
 return it.map(x=>`<div class="tl"><b>${tf(Math.floor(x[0]/60),x[0]%60)}</b><span>${x[1]} ${x[2]}</span></div>`).join('');
}
function profile(){
 const p=S.p||{name:'',sex:'m',age:16,h:170,w:70,goal:65};
 return `<h1>👤 پروفایل</h1><p class="mu">${S.p?'اطلاعات بدنی‌ات اینجاست.':'اول خودت رو معرفی کن تا برنامه و کالری‌ها دقیق حساب بشن.'}</p>
 <div class="card"><label>اسم</label><input id="name" value="${e(p.name||'')}" placeholder="اسمت چیه؟">
 <label>جنسیت</label><select id="sex"><option value="m" ${p.sex==='m'?'selected':''}>پسر</option><option value="f" ${p.sex==='f'?'selected':''}>دختر</option></select>
 <div class="g2"><div><label>سن</label><input id="age" inputmode="decimal" value="${fa(p.age)}"></div><div><label>قد (سانتی‌متر)</label><input id="h" inputmode="decimal" value="${fa(p.h)}"></div>
 <div><label>وزن فعلی (کیلو)</label><input id="w" inputmode="decimal" value="${fa(p.w)}"></div><div><label>وزن هدف (کیلو)</label><input id="goal" inputmode="decimal" value="${fa(p.goal)}"></div></div>
 <button onclick="saveP()">ذخیره</button>${S.p?'<button class="sec" style="margin-top:8px" onclick="tab=\'home\';render()">بازگشت</button>':''}</div>`;
}
function saveP(){
 const g=i=>$('#'+i).value,v={name:g('name').trim(),sex:g('sex'),age:num(g('age')),h:num(g('h')),w:num(g('w')),goal:num(g('goal'))};
 if(!v.age||!v.h||!v.w||!v.goal)return;
 S.p=Object.assign({wakeH:7,wakeM:0,gymH:17,gymM:0,sleepH:8,studyH:3,alarm:true},S.p||{},v);
 save();tab='home';render();scrollTo(0,0);
}
function setP(k,v){S.p[k]=v;save();render()}
const sel=(k,o,c)=>`<select onchange="setP('${k}',+this.value)">${o.map(x=>`<option value="${x[0]}" ${x[0]==c?'selected':''}>${x[1]}</option>`).join('')}</select>`;
const HO=[...Array(24).keys()].map(i=>[i,fa(pad(i))]),MO=[0,15,30,45].map(i=>[i,fa(pad(i))]);
const hal=(a,b,u)=>{const r=[];for(let i=a;i<=b;i+=.5)r.push([i,f1(i)+' '+u]);return r};
const tp=(k,h,m)=>`<div class="tp">${sel(k+'H',HO,h)}<b>:</b>${sel(k+'M',MO,m)}</div>`;
function plan(){
 const p=S.p;
 return `<h1>🗓️ برنامه‌ی روزانه</h1>
 <div class="card"><h2>تنظیم ساعت‌ها</h2>
 <div class="tr"><span>⏰ ساعت بیدار شدن</span>${tp('wake',p.wakeH,p.wakeM)}</div>
 <div class="tr"><span>🏋️ ساعت باشگاه</span>${tp('gym',p.gymH,p.gymM)}</div>
 <div class="tr"><span>🌙 مدت خواب</span><div class="tp" style="direction:rtl">${sel('sleepH',hal(5,10,'ساعت'),p.sleepH)}</div></div>
 <div class="tr"><span>📚 هدف مطالعه</span><div class="tp" style="direction:rtl">${sel('studyH',hal(1,10,'ساعت'),p.studyH)}</div></div>
 <div class="tr"><span>🔔 زنگ داخل برنامه</span><div class="tp" style="direction:rtl">${sel('alarm',[[1,'روشن'],[0,'خاموش']],p.alarm?1:0)}</div></div>
 <div class="mu">زنگ فقط وقتی برنامه باز باشه صدا می‌ده. برای زنگ مطمئن، از ساعت خود گوشی هم استفاده کن.</div></div>
 <div class="card"><h2>✨ ساخت برنامه از روی توضیح تو</h2><label>روزت رو توضیح بده: ساعت مدرسه، کلاس‌ها، هدف‌هات...</label><textarea id="sd" rows="3" placeholder="مثلاً: مدرسه ۸ تا ۱۳، بعدازظهر کلاس زبان، می‌خوام هر روز ورزش کنم و ۳ ساعت درس بخونم">${e(S.sd||'')}</textarea><button onclick="buildSched()" ${busy?'disabled':''}>${busy==='sched'?'در حال ساخت...':'ساخت برنامه‌ی روزانه'}</button>${S.blocks?'<button class="sec" style="margin-top:8px" onclick="S.blocks=null;save();render()">بازگشت به برنامه‌ی ساده</button>':''}${err&&tab==='plan'?`<p class="mu">${e(err)}</p>`:''}</div><div class="card"><h2>ترتیب روز تو</h2>${timeline()}</div>`;
}
function workout(){
 const d=day();
 return `<h1>🏋️ ورزش</h1>
 <div class="card"><h2>🔥 ${f(calc().burned)} کالری سوزانده‌شده امروز</h2><span class="mu">حرکت‌های تیک‌خورده و فعالیت‌های ثبت‌شده با هم جمع می‌شن</span></div><div class="card"><label>برنامه‌ات رو توضیح بده تا برات بسازم</label><textarea id="wd" rows="3" placeholder="مثلاً: ۴۵ دقیقه وقت دارم، فقط دمبل دارم و می‌خوام شکم و بازو رو تقویت کنم">${e(S.wd||'')}</textarea></div><button onclick="genPlan2()" ${busy?'disabled':''}>${busy==='plan'?'در حال ساخت برنامه...':d.plan?'ساخت برنامه‌ی جدید':'✨ ساخت برنامه‌ی امروز با هوش مصنوعی'}</button>
 ${err&&tab==='workout'?`<p class="mu">${e(err)}</p>`:''}
 ${d.plan?`<div class="card" style="margin-top:12px"><h2>${e(d.plan.title)}</h2>${d.plan.exercises.map((x,i)=>`<label class="row" style="color:var(--tx);font-size:15px"><input type="checkbox" ${d.done[i]?'checked':''} onchange="tick(${i},this.checked)"><div>${e(x.name)}<div class="mu">${e(x.detail)} • ${f(x.kcal)} کالری</div></div></label>`).join('')}</div>`:''}

  r=await ai(`تو مربی بدنسازی هستی. کاربر: ${prof()}. امروز ${dn} است. توضیح و خواسته‌ی کاربر: «${t||'برنامه‌ی متعادل برای امروز'}». بر اساس همین توضیح یک برنامه‌ی ورزشی ایمن بساز (گرم‌کردن، حرکت‌های اصلی، سردکردن) و حرکت‌ها را متناسب با زمان و امکاناتی که گفته انتخاب کن. همه‌ی متن‌ها فارسی. فقط JSON: {"title":"عنوان کوتاه","exercises":[{"name":"نام حرکت","detail":"مثلاً ۳ ست × ۱۲ تکرار","kcal":عدد}]}`,true);
  if(!r||!Array.isArray(r.exercises))throw 0;
  r.exercises=r.exercises.map(x=>({name:String(x.name),detail:String(x.detail||''),kcal:Math.round(+x.kcal||0)}));
 }catch(x){if(x&&x.code==='na'){r=offPlan(t);err='نسخه‌ی آفلاین: برنامه از روی کلمات توضیحت و حرکت‌های آماده ساخته شد.'}else{r=null;err=aiErr(x)}}
 if(r){const d=day();d.plan=r;d.done={};save()}
 busy='';render();
}
async function buildSched(){
 const t=$('#sd').value.trim();if(!t)return;S.sd=t;busy='sched';err='';save();render();
 try{
  const r=await ai(`تو مشاور برنامه‌ریزی روزانه‌ی یک دانش‌آموز هستی. کاربر: ${prof()}. توضیح کاربر درباره‌ی روزش و خواسته‌هایش: «${t}». یک برنامه‌ی روزانه‌ی واقع‌گرایانه و متعادل بساز (بیدار شدن، مدرسه یا کلاس‌ها، مطالعه، ورزش، غذا، استراحت و خواب با حداقل ۸ ساعت). فقط JSON: {"wakeH":عدد,"wakeM":عدد,"gymH":عدد,"gymM":عدد,"sleepH":ساعت خواب,"studyH":هدف ساعت مطالعه,"blocks":[{"h":ساعت,"m":دقیقه,"title":"عنوان فارسی کوتاه"}]}`,true);
  if(!r||!Array.isArray(r.blocks))throw 0;
  const p=S.p,n=(v,d)=>Number.isFinite(+v)?+v:d,q=v=>[0,15,30,45].includes(+v)?+v:0;
  p.wakeH=n(r.wakeH,p.wakeH);p.wakeM=q(r.wakeM);p.gymH=n(r.gymH,p.gymH);p.gymM=q(r.gymM);
  p.sleepH=Math.min(10,Math.max(5,Math.round(n(r.sleepH,8)*2)/2));p.studyH=Math.min(10,Math.max(1,Math.round(n(r.studyH,3)*2)/2));
  S.blocks=r.blocks.map(x=>({h:Math.min(23,Math.max(0,+x.h||0)),m:Math.min(59,Math.max(0,+x.m||0)),title:String(x.title)})).sort((a,b)=>a.h*60+a.m-(b.h*60+b.m));save();
 }catch(x){err=aiErr(x)}
 busy='';render();
}
function calCard(){const c=calc(),l=c.target-c.eaten+c.burned;return `<div class="card"><h2>⚡ کالری امروز</h2><div class="g3" style="text-align:center"><div><b style="font-size:20px">${f(c.eaten)}</b><div class="mu">مصرف‌شده</div></div><div><b style="font-size:20px">${f(c.burned)}</b><div class="mu">سوزانده‌شده</div></div><div><b style="font-size:20px;color:${l<0?'var(--wa)':'var(--ok)'}">${f(Math.abs(l))}</b><div class="mu">${l<0?'بیشتر از هدف':'باقی‌مانده'}</div></div></div><div class="bar"><i style="width:${Math.min(100,c.eaten/c.target*100)}%"></i></div><span class="mu">هدف روزانه: ${f(c.target)} کالری</span></div>`}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),1500)}catch(x){}}
setInterval(()=>{
 if(S.timer&&S.timer.run&&tab==='study'){const el=$('#tm');if(el)el.textContent=hms(tEl()/1000)}
 if(!S.p||!S.p.alarm)return;
 const n=new Date(),is=n.getHours()===S.p.wakeH&&n.getMinutes()===S.p.wakeM;
 if(is&&!rang){rang=true;ringNow=true;beep();if(tab==='home')render()}
 if(!is)rang=false;
},1000);
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
